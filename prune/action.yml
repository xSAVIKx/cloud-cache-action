name: 'Prune Caches (S3-Compatible)'
description: 'Delete cache archives by age, by count per ref, or to fit a total size budget in any S3-compatible storage'
author: 'Yurii Serhiichuk (https://serhiichuk.dev)'

inputs:
  bucket:
    description: 'The S3 bucket name where cache archives are stored'
    required: true
  endpoint:
    description: 'Custom S3-compatible endpoint URL (e.g., https://<account_id>.r2.cloudflarestorage.com or https://storage.googleapis.com)'
    required: false
  region:
    description: 'AWS or S3 provider region (e.g., us-east-1, auto, etc.)'
    required: false
  provider:
    description: 'Storage provider preset: aws, r2, gcs, b2, fastly, garage, seaweedfs, minio, rustfs, aws-emulator'
    required: false
  access-key:
    description: 'S3 Access Key ID (falls back to AWS_ACCESS_KEY_ID or IAM/OIDC)'
    required: false
  accessKey:
    description: 'Alias for access-key'
    required: false
  secret-key:
    description: 'S3 Secret Access Key (falls back to AWS_SECRET_ACCESS_KEY)'
    required: false
  secretKey:
    description: 'Alias for secret-key'
    required: false
  session-token:
    description: 'S3 Session Token (falls back to AWS_SESSION_TOKEN)'
    required: false
  sessionToken:
    description: 'Alias for session-token'
    required: false
  force-path-style:
    description: 'Force path-style S3 URLs (bucket in path rather than subdomain)'
    required: false
  prefix:
    description: 'Subfolder prefix path within the bucket'
    required: false
    default: ''
  s3-key-pattern:
    description: 'Template for the S3 object key. Default: ${GITHUB_REPOSITORY}/${prefix}${ref}/${key}/${version}/${archive_filename}'
    required: false
    default: '${GITHUB_REPOSITORY}/${prefix}${ref}/${key}/${version}/${archive_filename}'
  scoped-to-repository:
    description: 'Whether to prefix bucket cache paths with GITHUB_REPOSITORY (default: true)'
    required: false
    default: 'true'
  scoped-to-ref:
    description: 'Whether cache keys include the Git ref, as with scoped-to-ref on the main action (default: true). Set to false to prune caches saved with scoped-to-ref: false; "ref" must then be empty.'
    required: false
    default: 'true'
  retry:
    description: 'Enable retries with exponential backoff on failure for S3 operations'
    required: false
    default: 'true'
  retry-count:
    description: 'Number of times to retry S3 operations in case of failure'
    required: false
    default: '3'

  older-than-days:
    description: 'Delete cache archives whose last-modified time is older than this many days. Set at least one of older-than-days, keep-latest, max-total-size and abort-uploads-older-than-hours.'
    required: false
  keep-latest:
    description: 'Positive integer. In each ref, never delete the N most recently modified cache archives. Alone, it deletes every other archive of the ref; with another archive rule (older-than-days or max-total-size) it only protects. A key pattern with no ref counts the whole scope as one ref.'
    required: false
  max-total-size:
    description: 'Total size budget in bytes (a plain integer, 0 allowed). After the other rules, delete the oldest remaining cache archives in the scope until the total size fits. keep-latest archives are never deleted.'
    required: false
  abort-uploads-older-than-hours:
    description: 'Positive integer. Abort incomplete multipart uploads under the prune scope that started more than this many hours ago. This rule deletes no cache archive. Set the limit above the duration of your longest save, because prune aborts a save in progress that is older than the limit. A provider that cannot list uploads gets a warning, not a failure. Measured: RustFS and Garage abort; SeaweedFS lists uploads without a start time, so prune aborts none and warns; MinIO lists no upload for a prefix, so prune aborts none. Off when omitted.'
    required: false
  ref:
    description: 'Prune only caches under this full Git ref, such as refs/heads/main (not main); every ref when omitted'
    required: false
  dry-run:
    description: 'List cache archives that would be pruned without deleting anything'
    required: false
    default: 'false'

  # Metrics input
  metrics-file:
    description: 'Append one JSON line of timings and sizes for this step to this file (relative to the workspace)'
    required: false
    default: ''

outputs:
  pruned-count:
    description: 'The number of cache archives pruned (or that would be pruned in a dry run)'
  pruned-bytes:
    description: 'The total size in bytes of the pruned cache archives'
  kept-count:
    description: 'The number of cache archives that matched the scope but no rule selected for pruning'
  aborted-uploads:
    description: 'The number of incomplete multipart uploads aborted (or that would be aborted in a dry run)'

runs:
  using: 'node24'
  main: '../dist/prune/index.js'

branding:
  icon: 'trash-2'
  color: 'blue'
