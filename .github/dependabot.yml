version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5
    ignore:
      # TypeScript 7 is a native compiler and has no JavaScript compiler API.
      # ts-jest declares the peer range "typescript >=4.3 <7".
      # typescript-eslint declares the peer range "typescript >=4.8.4 <6.1.0".
      # Remove this rule when both tools support TypeScript 7.
      - dependency-name: 'typescript'
        update-types:
          - 'version-update:semver-major'
    # Runtime dependencies are bundled into dist/, so their PRs also need a dist rebuild
    # (.github/workflows/dependabot-dist.yml does it). Dev dependencies do not change dist/. Two
    # groups keep a red runtime PR from blocking the dev-only updates.
    groups:
      npm-runtime:
        dependency-type: 'production'
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'
      npm-dev:
        dependency-type: 'development'
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'
    # Wait before a new version gets a PR. The registry often removes a bad release in this time.
    # Security updates do not wait.
    cooldown:
      default-days: 7
    commit-message:
      prefix: 'deps'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    groups:
      actions:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'
    cooldown:
      default-days: 7
    commit-message:
      prefix: 'ci'

  # Keeps the image tags and digests in docker-compose.test.yml current.
  - package-ecosystem: 'docker-compose'
    directory: '/'
    schedule:
      interval: 'weekly'
    commit-message:
      prefix: 'ci'
