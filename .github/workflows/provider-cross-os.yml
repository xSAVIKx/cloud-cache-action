name: Provider - Cross-OS (Cloudflare R2)

on:
  workflow_dispatch:
  schedule:
    - cron: '30 4 * * *'

permissions:
  contents: read

env:
  KEY: xos-live-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  check:
    name: Check R2 secrets
    runs-on: ubuntu-latest
    outputs:
      has-secrets: ${{ steps.check.outputs.has-secrets }}
    steps:
      - id: check
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          if [ -n "$R2_ACCOUNT_ID" ] && [ -n "$R2_ACCESS_KEY_ID" ] && [ -n "$R2_SECRET_ACCESS_KEY" ] && [ -n "$R2_BUCKET" ]; then
            echo "has-secrets=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Cloudflare R2 secrets are not configured. Skipping the live cross-OS test."
            echo "has-secrets=false" >> "$GITHUB_OUTPUT"
          fi

  save:
    name: Save on Linux
    needs: check
    if: needs.check.outputs.has-secrets == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build the portable fixture tree
        id: fixture
        run: node tests/support/fixtureTree.ts build "$RUNNER_TEMP/seed/fixture.json" --portable --large-bytes 8388608
      - uses: ./save
        with:
          key: ${{ env.KEY }}
          path: ${{ steps.fixture.outputs.paths }}
          enableCrossOsArchive: true
          bucket: ${{ secrets.R2_BUCKET }}
          endpoint: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          access-key: ${{ secrets.R2_ACCESS_KEY_ID }}
          secret-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: xos-live-manifest
          path: ${{ runner.temp }}/seed/fixture.json
          if-no-files-found: error

  restore:
    name: Restore on ${{ matrix.os }}
    needs: save
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Require zstd, which the Linux save used
        run: zstd --version
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: xos-live-manifest
          path: ${{ runner.temp }}/seed
      - name: Read the seeded paths
        id: seed
        run: node tests/support/fixtureTree.ts paths "$RUNNER_TEMP/seed/fixture.json"
      - name: Restore with enableCrossOsArchive
        id: cross
        uses: ./restore
        with:
          key: ${{ env.KEY }}
          path: ${{ steps.seed.outputs.paths }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true
          bucket: ${{ secrets.R2_BUCKET }}
          endpoint: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          access-key: ${{ secrets.R2_ACCESS_KEY_ID }}
          secret-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      - name: Verify
        run: |
          test "${{ steps.cross.outputs.cache-hit }}" = "true"
          node tests/support/fixtureTree.ts verify "$RUNNER_TEMP/seed/fixture.json"

  cleanup:
    name: Delete this run's objects
    needs: [check, save, restore]
    if: always() && needs.check.outputs.has-secrets == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Delete objects saved by this run
        env:
          TEST_S3_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          TEST_S3_REGION: auto
          TEST_S3_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY_ID }}
          TEST_S3_SECRET_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          TEST_S3_BUCKET: ${{ secrets.R2_BUCKET }}
        run: node tests/ci/s3Objects.ts delete "$GITHUB_REPOSITORY/" "/$KEY/"
