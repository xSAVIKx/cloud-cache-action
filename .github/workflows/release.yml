name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    name: Verify release and move the major tag
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          # All history and tags, so the major tag step can find the highest release.
          fetch-depth: 0
          # Nothing before the push step gets a token in .git/config.
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      # The build needs no install scripts (no prepare or postinstall hook, and ncc needs none).
      - run: npm ci --ignore-scripts
      - name: Verify package.json version matches the release tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="${TAG#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$VERSION" != "$PKG_VERSION" ]; then
            echo "::error::package.json version ($PKG_VERSION) does not match the release tag ($TAG)"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - run: npm run build
      - name: Verify dist is up to date
        run: |
          if [ -n "$(git status --porcelain dist)" ]; then
            echo "::error::dist is stale for this release. Run npm run build and commit the result before publishing."
            git status --porcelain dist
            exit 1
          fi
      - name: Move the major version tag
        if: ${{ !github.event.release.prerelease }}
        env:
          TAG: ${{ github.event.release.tag_name }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          MAJOR="v${VERSION%%.*}"
          RELEASE_SHA="$(git rev-parse HEAD)"
          REMOTE="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --force --tags "$REMOTE"
          HIGHEST="$(git tag -l "$MAJOR.*" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1 || true)"
          if [ "$TAG" != "$HIGHEST" ]; then
            echo "::notice::$TAG is not the highest $MAJOR release (${HIGHEST:-none found}); leaving the $MAJOR tag where it is."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898828+github-actions[bot]@users.noreply.github.com"
          git tag -fa "$MAJOR" -m "Release $MAJOR" "$RELEASE_SHA"
          git push --force "$REMOTE" "refs/tags/$MAJOR:refs/tags/$MAJOR"
