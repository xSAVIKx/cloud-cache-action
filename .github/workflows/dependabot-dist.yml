name: Dependabot dist rebuild

# A runtime dependency bump changes the bundle in dist/, so the dist check of CI Tests fails on
# each such Dependabot PR. This workflow rebuilds dist/ for a Dependabot npm PR and pushes the
# result to the PR branch.
#
# Safety:
# - The trigger is pull_request, not pull_request_target. The jobs run only for a PR that
#   Dependabot opened from a branch of this repository.
# - The build job runs npm ci and the build with a read-only token.
# - The push job has contents: write. It runs no repository code. It replaces dist/ with the
#   files from the build job, refuses any change outside dist/, and pushes only when the branch
#   head is still the commit that the build job used.
#
# A push with GITHUB_TOKEN does not start new workflow runs. CI Tests therefore does not run on
# the dist commit by itself. To run CI, close and reopen the PR. The push job writes this note to
# the job summary.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions: {}

concurrency:
  group: dependabot-dist-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    name: Build dist
    if: >-
      github.actor == 'dependabot[bot]' &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.head_ref, 'dependabot/npm_and_yarn/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Compare dist with the PR head
        id: diff
        run: |
          if [ -n "$(git status --porcelain dist)" ]; then
            git status --porcelain dist
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "dist is up to date."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.diff.outputs.changed == 'true'
        with:
          name: dist
          path: dist
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1

  push:
    name: Push the rebuilt dist
    needs: build
    if: >-
      needs.build.outputs.changed == 'true' &&
      github.actor == 'dependabot[bot]' &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.head_ref, 'dependabot/npm_and_yarn/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      HEAD_REF: ${{ github.head_ref }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      # This job does not install dependencies and does not run repository code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: ${{ runner.temp }}/dist
      - name: Replace dist with the rebuilt files
        run: |
          if [ -n "$(find "$RUNNER_TEMP/dist" -type l)" ]; then
            echo "::error::The rebuilt dist contains symbolic links. Nothing is pushed."
            exit 1
          fi
          rm -rf dist
          cp -R "$RUNNER_TEMP/dist" dist
          git add -A dist
          OUTSIDE="$(git status --porcelain | grep -v -E '^.. dist/' || true)"
          if [ -n "$OUTSIDE" ]; then
            echo "::error::Changes outside dist/. Nothing is pushed."
            echo "$OUTSIDE"
            exit 1
          fi
          git status --porcelain
      - name: Commit and push to the Dependabot branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if git diff --cached --quiet; then
            echo "dist is up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898828+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "build: rebuild dist"
          REMOTE="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          # A plain push is a fast-forward of HEAD_SHA only. It fails when the branch moved after
          # the build job started, and the run for the new head then rebuilds dist.
          git push "$REMOTE" "HEAD:refs/heads/${HEAD_REF}"
          {
            echo "### dist rebuilt for PR #${PR_NUMBER}"
            echo
            echo "This workflow pushed $(git rev-parse --short HEAD) on top of ${HEAD_SHA}."
            echo "A push with GITHUB_TOKEN does not start CI Tests."
            echo "To run CI on the new commit, close and reopen the PR:"
            echo
            echo '```sh'
            echo "gh pr close ${PR_NUMBER} --repo ${GITHUB_REPOSITORY} && gh pr reopen ${PR_NUMBER} --repo ${GITHUB_REPOSITORY}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::dist was rebuilt and pushed. CI Tests does not run on that commit by itself. Close and reopen PR #${PR_NUMBER} to run it."
