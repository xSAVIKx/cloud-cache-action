name: 'Cloud Cache Action'
description: 'Cache artifacts to any S3-compatible storage with 1:1 actions/cache parity and dual-caching'
author: 'Yurii Serhiichuk (https://serhiichuk.dev)'

inputs:
  # Official actions/cache standard inputs
  path:
    description: 'A list of files, directories, and wildcard patterns to cache and restore'
    required: true
  key:
    description: 'An explicit key for restoring and saving the cache'
    required: true
  restore-keys:
    description: 'An ordered multiline string listing the prefix-matched keys, used for restoring stale cache if no cache hit occurred for key'
    required: false
  upload-chunk-size:
    description: 'The chunk size used to split up large files during upload, in bytes (5 MiB to 128 MiB; default 64 MiB, as in actions/cache)'
    required: false
  upload-concurrency:
    description: 'How many multipart upload parts are sent at once (1-32)'
    required: false
    default: '8'
  compression-level:
    description: 'Compression level for saving: 1-19 for zstd, 1-9 for gzip. Unset uses the tool default (zstd 3). Lower is faster and larger.'
    required: false
  enableCrossOsArchive:
    description: 'An optional boolean when enabled, allows windows runners to save or restore caches that can be restored or saved respectively on other platforms'
    default: 'false'
    required: false
  fail-on-cache-miss:
    description: 'Fail the workflow if cache entry is not found'
    default: 'false'
    required: false
  lookup-only:
    description: 'Check if a cache entry exists for the given input(s) (key, restore-keys) without downloading the cache'
    default: 'false'
    required: false
  read-only:
    description: 'Restore cache but do not save cache in post step'
    default: 'false'
    required: false

  # S3 Storage inputs
  bucket:
    description: 'The S3 bucket name where cache archives are stored'
    required: true
  endpoint:
    description: 'Custom S3-compatible endpoint URL (e.g., https://<account_id>.r2.cloudflarestorage.com or https://storage.googleapis.com)'
    required: false
  region:
    description: 'AWS or S3 provider region (e.g., us-east-1, auto, etc.)'
    required: false
  provider:
    description: 'Storage provider preset: aws, r2, gcs, b2, fastly, garage, seaweedfs, minio, rustfs'
    required: false
  access-key:
    description: 'S3 Access Key ID (falls back to AWS_ACCESS_KEY_ID or IAM/OIDC)'
    required: false
  accessKey:
    description: 'Alias for access-key'
    required: false
  secret-key:
    description: 'S3 Secret Access Key (falls back to AWS_SECRET_ACCESS_KEY)'
    required: false
  secretKey:
    description: 'Alias for secret-key'
    required: false
  session-token:
    description: 'S3 Session Token (falls back to AWS_SESSION_TOKEN)'
    required: false
  sessionToken:
    description: 'Alias for session-token'
    required: false
  force-path-style:
    description: 'Force path-style S3 URLs (bucket in path rather than subdomain)'
    required: false
  prefix:
    description: 'Subfolder prefix path within the bucket'
    required: false
    default: ''
  s3-key-pattern:
    description: 'Template for the S3 object key. Default: ${GITHUB_REPOSITORY}/${prefix}${ref}/${key}/${version}/${archive_filename}'
    required: false
    default: '${GITHUB_REPOSITORY}/${prefix}${ref}/${key}/${version}/${archive_filename}'
  scoped-to-repository:
    description: 'Whether to prefix bucket cache paths with GITHUB_REPOSITORY (default: true)'
    required: false
    default: 'true'
  scoped-to-ref:
    description: 'Save caches under the current Git ref and restore from the current ref, then the pull request base branch, then the default branch (like actions/cache). Set to false to share caches across all refs.'
    required: false
    default: 'true'
  retry:
    description: 'Enable retries with exponential backoff on failure for S3 operations'
    required: false
    default: 'true'
  retry-count:
    description: 'Number of times to retry S3 operations in case of failure'
    required: false
    default: '3'
  use-fallback:
    description: 'Fall back to official GitHub Actions Cache service if S3 operations fail or miss'
    required: false
    default: 'false'
  streaming:
    description: 'Stream archives directly between tar and S3 without a temporary archive file (experimental; default false). Uses less disk and can be faster for large caches, but uploads cannot be retried as a whole and objects carry no integrity checksum.'
    required: false
    default: 'false'
  metadata:
    description: 'User metadata to store on every saved cache object, one key=value per line (stored as x-amz-meta-*; surrounding whitespace is trimmed; keys starting with cloud-cache- are reserved; 2 KB total)'
    required: false
  tags:
    description: 'Object tags to set on every saved cache object, one key=value per line (up to 10; ignored with a warning on providers without object tagging)'
    required: false
  download-concurrency:
    description: 'How many ranged GET requests a restore runs at once when the archive is larger than download-chunk-size (1-32). Set to 1 to download the archive in one request.'
    required: false
    default: '8'
  download-chunk-size:
    description: 'Bytes per ranged GET request of a parallel download (1 MiB to 128 MiB). Archives no larger than this are downloaded in one request.'
    required: false
    default: '8388608'

  # Dual-cache inputs
  dual-cache:
    description: 'Cache to both S3-compatible storage and GitHub Actions Cache simultaneously'
    required: false
    default: 'false'
  restore-priority:
    description: 'Order of cache sources to query during restore: s3-first or github-first'
    required: false
    default: 's3-first'
  dual-cache-strategy:
    description: 'Sync strategy for saving in dual-cache mode: backfill (upload to a tier only if it lacks the key) or skip-on-hit'
    required: false
    default: 'backfill'
  dual-cache-strict:
    description: 'Fail step if either tier encounters an error during dual-cache operations (default: false, fault-tolerant)'
    required: false
    default: 'false'

  # Job summary input
  job-summary:
    description: 'Write a job summary table with the cache keys, hit, source, size, and duration'
    required: false
    default: 'true'

  # Explain input
  explain:
    description: 'Log why the lookup hits or misses (resolved pattern, version, refs searched and every candidate object) before restoring'
    required: false
    default: 'false'

  # Metrics input
  metrics-file:
    description: 'Append one JSON line of timings and sizes for this step to this file (relative to the workspace)'
    required: false
    default: ''

outputs:
  cache-hit:
    description: 'A boolean value to indicate an exact match was found for the primary key'
  cache-primary-key:
    description: 'A resolved cache key for which cache match was attempted'
  cache-matched-key:
    description: 'Key of the cache that was restored, either the primary key or a partial match'
  cache-size:
    description: 'The size of the restored/saved cache archive in bytes'
  cache-storage-provider:
    description: 'The resolved S3-compatible storage provider'
  cache-s3-key:
    description: 'The full S3 object key inside the bucket'
  cache-etag:
    description: 'The ETag checksum of the cache archive in S3'
  cache-metadata:
    description: 'JSON object of the restored object''s user metadata (excluding cloud-cache-* keys); {} when none, on a GitHub-tier hit, or with lookup-only: true'
  cache-hit-source:
    description: 'The cache tier that serviced the restore hit: s3, github, or none'
  cache-saved-sources:
    description: 'Comma-separated list of cache tiers successfully saved to: s3, github, or s3,github'
  cache-restore-duration-ms:
    description: 'Wall-clock milliseconds the restore step took; 0 when it did not complete'
  cache-save-duration-ms:
    description: 'Wall-clock milliseconds the save step took; 0 when it did not complete'
  cache-transfer-duration-ms:
    description: 'Milliseconds spent on the S3 download or upload alone; 0 when nothing was transferred'
  cache-bytes:
    description: 'The size in bytes of the cache archive restored or saved; 0 when none was'

runs:
  using: 'node24'
  main: 'dist/restore/index.js'
  post: 'dist/save/index.js'
  post-if: 'success()'

branding:
  icon: 'cloud'
  color: 'blue'
