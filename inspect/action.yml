name: 'Inspect Cache Lookup (S3-Compatible)'
description: 'Explain which cache object a restore would use and why, without restoring'
author: 'Yurii Serhiichuk (https://serhiichuk.dev)'

inputs:
  path:
    description: 'A list of files, directories, and wildcard patterns to restore'
    required: true
  key:
    description: 'An explicit key for restoring the cache'
    required: true
  restore-keys:
    description: 'An ordered multiline string listing the prefix-matched keys, used for restoring stale cache if no cache hit occurred for key'
    required: false
  enableCrossOsArchive:
    description: 'An optional boolean when enabled, allows windows runners to restore caches that were saved on other platforms'
    default: 'false'
    required: false
  fail-on-cache-miss:
    description: 'Fail the workflow if cache entry is not found'
    default: 'false'
    required: false

  # S3 Storage inputs
  bucket:
    description: 'The S3 bucket name where cache archives are stored'
    required: true
  endpoint:
    description: 'Custom S3-compatible endpoint URL'
    required: false
  region:
    description: 'AWS or S3 provider region'
    required: false
  provider:
    description: 'Storage provider preset: aws, r2, gcs, b2, fastly, garage, seaweedfs, minio, rustfs, aws-emulator'
    required: false
  access-key:
    description: 'S3 Access Key ID'
    required: false
  accessKey:
    description: 'Alias for access-key'
    required: false
  secret-key:
    description: 'S3 Secret Access Key'
    required: false
  secretKey:
    description: 'Alias for secret-key'
    required: false
  session-token:
    description: 'S3 Session Token'
    required: false
  sessionToken:
    description: 'Alias for session-token'
    required: false
  force-path-style:
    description: 'Force path-style S3 URLs'
    required: false
  prefix:
    description: 'Subfolder prefix path within the bucket'
    required: false
    default: ''
  s3-key-pattern:
    description: 'Template for the S3 object key. Default: ${GITHUB_REPOSITORY}/${prefix}${ref}/${key}/${version}/${archive_filename}'
    required: false
    default: '${GITHUB_REPOSITORY}/${prefix}${ref}/${key}/${version}/${archive_filename}'
  scoped-to-repository:
    description: 'Whether to prefix bucket cache paths with GITHUB_REPOSITORY (default: true)'
    required: false
    default: 'true'
  scoped-to-ref:
    description: 'Save caches under the current Git ref and restore from the current ref, then the pull request base branch, then the default branch (like actions/cache). Set to false to share caches across all refs.'
    required: false
    default: 'true'
  retry:
    description: 'Enable retries with exponential backoff on failure for S3 operations'
    required: false
    default: 'true'
  retry-count:
    description: 'Number of times to retry S3 operations in case of failure'
    required: false
    default: '3'

  # Tier inputs: they decide the "Tiers:" line of the report, not what inspect lists.
  use-fallback:
    description: 'Fall back to official GitHub Actions Cache service if S3 operations fail or miss'
    required: false
    default: 'false'
  dual-cache:
    description: 'Cache to both S3-compatible storage and GitHub Actions Cache simultaneously'
    required: false
    default: 'false'
  restore-priority:
    description: 'Order of cache sources to query during restore: s3-first or github-first'
    required: false
    default: 's3-first'

  # Job summary input
  job-summary:
    description: 'Write a "Cache lookup explained" job summary section with the full lookup report'
    required: false
    default: 'true'

  max-candidates:
    description: 'How many candidate objects the report shows per search; every object under the prefix is still listed, as a restore does (default 20)'
    required: false
    default: '20'

  # Metrics input
  metrics-file:
    description: 'Append one JSON line of timings and sizes for this step to this file (relative to the workspace)'
    required: false
    default: ''

outputs:
  would-hit:
    description: 'true when a restore with these inputs would find a cache'
  would-match-key:
    description: 'The cache key a restore would match, empty when none'
  would-match-object:
    description: 'The S3 object key a restore would download, empty when none'
  candidate-count:
    description: 'How many objects were listed across every search'
  report:
    description: 'The full lookup report as JSON (truncated to a summary beyond 64 KB)'
  cache-storage-provider:
    description: 'The resolved S3-compatible storage provider'

runs:
  using: 'node24'
  main: '../dist/inspect/index.js'

branding:
  icon: 'search'
  color: 'blue'
